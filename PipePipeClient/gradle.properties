android.useAndroidX=true
android.enableJetifier=true
// Non-final app R IDs (required by R8 optimized resource shrinking with
// shrinkResources=true). Safe here: the only Java switch on a resource ID
// uses framework android.R.id.home, which stays a compile-time constant.
android.nonFinalResIds=true
android.nonTransitiveRClass=false
android.builtInKotlin=false
android.newDsl=false
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Capped for stability on machines with <=8GB RAM (daemon + Kotlin daemon
# each reserve heap; 4G+4G defaults get OOM-killed there).
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true
systemProp.file.encoding=utf-8
